name: Build signed KernelSU Manager

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5"

permissions:
  contents: write

concurrency:
  group: kernelsu-release-build
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      should_build: ${{ steps.latest.outputs.should_build }}
    steps:
      - name: Check upstream latest release
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/tiann/KernelSU/releases/latest | jq -er '.tag_name')"
          state="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/last-upstream-release" 2>/dev/null || true)"
          previous_tag="$(jq -r '.content // empty' <<< "$state" | base64 --decode 2>/dev/null || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$tag" != "$previous_tag" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building new/manual KernelSU release: $tag (last built: ${previous_tag:-none})"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "KernelSU $tag was already built; skipping."
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release source
        env:
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
        run: git clone --depth 1 --branch "$RELEASE_TAG" https://github.com/tiann/KernelSU.git source

      - name: Configure signing keystore
        working-directory: source/manager
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing repository secret: KEYSTORE" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing repository secret: KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing repository secret: KEY_ALIAS" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing repository secret: KEY_PASSWORD" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            printf 'KEYSTORE_FILE=release.jks\n'
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK with custom package and app names
        working-directory: source/manager
        run: ./gradlew --no-daemon clean assembleRelease -PKSU_PACKAGE_NAME=ai.make.kernels -PKSU_NAME=kernels

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernels-${{ needs.check-release.outputs.tag }}-ai.make.kernels
          path: source/manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Save successfully built release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/contents/.github/last-upstream-release"
          state="$(gh api "$api" 2>/dev/null || true)"
          previous_tag="$(jq -r '.content // empty' <<< "$state" | base64 --decode 2>/dev/null || true)"
          if [[ "$previous_tag" == "$RELEASE_TAG" ]]; then
            echo "Release marker already records $RELEASE_TAG; no update needed."
            exit 0
          fi
          encoded_tag="$(printf '%s' "$RELEASE_TAG" | base64 --wrap=0)"
          if sha="$(jq -er '.sha' <<< "$state" 2>/dev/null)"; then
            gh api --method PUT "$api" \
              -f message="Record built KernelSU release $RELEASE_TAG" \
              -f content="$encoded_tag" -f branch=main -f sha="$sha" >/dev/null
          else
            gh api --method PUT "$api" \
              -f message="Record built KernelSU release $RELEASE_TAG" \
              -f content="$encoded_tag" -f branch=main >/dev/null
          fi
