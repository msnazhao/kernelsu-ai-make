name: Build signed KernelSU Manager

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5"

permissions:
  contents: write

concurrency:
  group: kernelsu-release-build
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      should_build: ${{ steps.latest.outputs.should_build }}
    steps:
      - name: Check upstream release
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/tiann/KernelSU/releases/latest | jq -er '.tag_name')"
          release="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets 2>/dev/null || true)"
          has_apk="$(jq -r '[.assets[]? | select((.name // "") | test("v.+_[0-9]+-ksud\\.apk$"))] | length > 0' <<< "$release" 2>/dev/null || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$has_apk" != "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building KernelSU $tag (release APK present: $has_apk)"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already has an APK; skipping."
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build configuration and patches
        uses: actions/checkout@v7
      - name: Download release source
        env:
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
        run: git clone --branch "$RELEASE_TAG" https://github.com/tiann/KernelSU.git source
      - name: Download matching upstream ksud binaries
        env:
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-linux-android x86_64-linux-android riscv64-linux-android; do
            destination="source/target/$target/release/ksud"
            mkdir -p "$(dirname "$destination")"
            curl -fsSL --retry 3 \
              "https://github.com/tiann/KernelSU/releases/download/${RELEASE_TAG}/ksud-${target}" \
              -o "$destination"
            test -s "$destination"
          done
      - name: Patch manager update channel
        run: git -C source apply ../patches/kernelsu-update-channel.patch

      - name: Configure signing keystore
        working-directory: source/manager
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing repository secret: KEYSTORE" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing repository secret: KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing repository secret: KEY_ALIAS" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing repository secret: KEY_PASSWORD" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            printf 'KEYSTORE_FILE=release.jks\n'
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build signed APK with custom package and app names
        working-directory: source/manager
        run: ./gradlew --no-daemon clean assembleRelease -PKSU_PACKAGE_NAME=ai.make.kernels -PKSU_NAME=kernels

      - name: Repack manager with matching ksud binaries
        id: apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$(find source/manager/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          gradle_name="$(basename "$source_apk" .apk)"
          output_name="${gradle_name%-release}-ksud"
          python3 source/repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a x86_64 \
            -a riscv64 \
            -K manager/release.jks \
            -A "$KEY_ALIAS" \
            -P "$KEYSTORE_PASSWORD" \
            -S "$KEY_PASSWORD" \
            -n "$output_name"

          mkdir -p release
          apk_path="release/${output_name}.apk"
          cp "source/dist/${output_name}.apk" "$apk_path"
          python3 - "$apk_path" <<'PY'
          import sys
          from zipfile import ZipFile

          apk = sys.argv[1]
          required = {
              "lib/arm64-v8a/libksud.so",
              "lib/x86_64/libksud.so",
              "lib/riscv64/libksud.so",
          }
          with ZipFile(apk) as package:
              missing = required.difference(package.namelist())
          if missing:
              raise SystemExit(f"APK missing required ksud libraries: {sorted(missing)}")
          print(f"Verified ksud libraries in {apk}")
          PY
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_apks="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name | endswith(".apk")) | .name')"
            while IFS= read -r old_apk; do
              [[ -n "$old_apk" && "$old_apk" != "$(basename "$APK_PATH")" ]] || continue
              gh release delete-asset "$RELEASE_TAG" "$old_apk" --repo "$GITHUB_REPOSITORY" --yes
            done <<< "$existing_apks"
            gh release upload "$RELEASE_TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "KernelSU $RELEASE_TAG (kernels)" \
              --notes "Built from tiann/KernelSU $RELEASE_TAG. Package: ai.make.kernels."
          fi
